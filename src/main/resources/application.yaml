spring:
  application:
    name: test_docker

  datasource:
    url: jdbc:mysql://mysql:3306/test_docker_db
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true