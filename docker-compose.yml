services:
  app:
    build: . # take the Dockerfile in the current directory
    container_name: my_app_container
    ports:
     - "8080:8080"
    depends_on: # wait for the mysql container to be ready before starting the app
      - mysql

  mysql:
    image: mysql:8.0
    container_name: my_mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: test_docker_db
    ports:
        - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql #may be another name for the volume

volumes:  # define the volume name here
    mysql_data: